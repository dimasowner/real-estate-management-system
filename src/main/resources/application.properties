spring.application.name=RealEstate Sales

# database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_crm
#spring.datasource.username=postgres
#spring.datasource.password=sorento
spring.datasource.driver-class-name=org.postgresql.Driver

# liquibase configuration
spring.liquibase.changelog=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# jpa configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true